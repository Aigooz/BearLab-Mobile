name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.1.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_TAG_FROM_REF: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\\([0-9][^'\"]*\\)['\"].*/\\1/p" app/build.gradle | head -n 1)"
          expected_code="$(awk '$1 == "versionCode" { print $2; exit }' app/build.gradle)"
          test -n "$expected_version"
          [[ "$expected_code" =~ ^[0-9]+$ ]]
          if [[ "$RELEASE_TAG_FROM_REF" == "true" ]]; then
            release_tag="$(git tag --points-at HEAD | grep -xE "v?$expected_version" | head -n 1)"
            test -n "$release_tag"
            RELEASE_TAG="$release_tag"
            echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          else
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
          version="${RELEASE_TAG#v}"
          test "$version" = "$expected_version"
          echo "VERSION_NAME=$expected_version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$expected_code" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            test "$(git rev-list -n1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$RELEASE_TAG" -m "BearLab Mobile $version"
            git push origin "$RELEASE_TAG" 2>/dev/null ||
              git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          fi
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: BearLab contract
        run: node tests/bearlab-contract.mjs
      - name: Android layout
        env:
          PP_TEST_SCREENSHOTS: ${{ runner.temp }}/bearlab-layout
        run: node tests/bearlab-mobile-layout.mjs
      - name: Update frontend
        run: node tests/updates.mjs
      - name: Update rules
        run: |
          rm -rf update-rules
          mkdir -p update-rules
          javac -d update-rules app/src/main/java/com/ppapi/mobile/UpdateRules.java tests/UpdateRulesTest.java
          java -cp update-rules com.ppapi.mobile.UpdateRulesTest
      - name: Build signed APK
        env:
          BEARLAB_KEYSTORE_FILE: ${{ runner.temp }}/bearlab-release.jks
          BEARLAB_KEYSTORE_PASSWORD: ${{ secrets.BEARLAB_KEYSTORE_PASSWORD }}
          BEARLAB_KEY_ALIAS: ${{ secrets.BEARLAB_KEY_ALIAS }}
          BEARLAB_KEY_PASSWORD: ${{ secrets.BEARLAB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.BEARLAB_KEYSTORE_BASE64 }}' | base64 -d > "$BEARLAB_KEYSTORE_FILE"
          chmod 600 "$BEARLAB_KEYSTORE_FILE"
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -f app/build/outputs/apk/release/BearLab-AI-release.apk
          build_tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/BearLab-AI-release.apk
          "$build_tools/aapt" dump badging app/build/outputs/apk/release/BearLab-AI-release.apk | grep -F "package: name='com.ppapi.mobile' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          sha256sum app/build/outputs/apk/release/BearLab-AI-release.apk | tee BearLab-AI-release.apk.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          printf 'BearLab AI Mobile %s\n' "$RELEASE_TAG" > "$notes"
          cat >> "$notes" <<EOF

          - BearLab platform usage, model plaza and channel availability
          - PP-style account dashboard with live usage, quality and concurrency
          - Bear announcements, model preview and complete usage analytics
          - Android in-app download and system installer updates via GitHub Releases
          - SHA-256 is attached to this release and verified by the app
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/release/BearLab-AI-release.apk \
            BearLab-AI-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "BearLab AI Mobile $RELEASE_TAG" \
            --notes-file "$notes" \
            --verify-tag \
            --latest
